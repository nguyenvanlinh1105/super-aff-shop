name: CI/CD Pipeline - Deploy MeowBack to VPS

on:
  push:
    branches:
      - master # Tự động kích hoạt khi push trực tiếp hoặc merge PR vào nhánh master
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên giao diện GitHub

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to VPS Production
    runs-on: ubuntu-latest

    steps:
      - name: 📡 SSH to VPS & Auto Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 [CI/CD] Bắt đầu quá trình cập nhật MeowBack..."
            cd /var/www/meowback

            # 1. Kéo mã nguồn mới nhất từ nhánh master (dùng SSH Deploy Key cho Private Repo)
            echo "📥 [1/4] Kéo mã nguồn mới nhất từ GitHub..."
            git fetch origin master
            git reset --hard origin/master

            # 2. Build lại container app không dùng cache và khởi động lại container
            echo "🔨 [2/4] Build ứng dụng Next.js (no-cache) và khởi động lại container..."
            docker compose build --no-cache app
            docker rm -f meowback_app 2>/dev/null || true
            docker compose up -d --force-recreate app

            # 3. Chạy Prisma Migrate & DB Push đồng bộ database schema
            echo "🗄️ [3/4] Cập nhật Database schema..."
            docker compose exec -T app npx prisma db push --skip-generate || true
            docker compose exec -T app npx prisma migrate deploy || true

            # 4. Tự động đồng bộ & bảo đảm kết nối Telegram Bot Webhook
            echo "🤖 [4/5] Tự động đồng bộ và bảo đảm kết nối Telegram Bot..."
            sleep 3
            docker compose exec -T app node -e "
              const https = require('https');
              const token = process.env.TELEGRAM_BOT_TOKEN;
              const appUrl = (process.env.NEXT_PUBLIC_APP_URL || 'https://meowback.shop').replace(/\/+$/, '');
              const secret = process.env.TELEGRAM_WEBHOOK_SECRET;
              if (!token) {
                console.log('Skipping Telegram sync: No TELEGRAM_BOT_TOKEN');
                process.exit(0);
              }
              const payload = JSON.stringify({
                url: appUrl + '/api/telegram/webhook',
                secret_token: secret || undefined,
                allowed_updates: ['message', 'callback_query'],
                drop_pending_updates: false
              });
              const req = https.request('https://api.telegram.org/bot' + token + '/setWebhook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) }
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => console.log('Telegram Webhook Sync:', data));
              });
              req.on('error', err => console.warn('Telegram setWebhook error:', err.message));
              req.write(payload);
              req.end();
            " || true

            # 5. Dọn dẹp Docker images cũ để tiết kiệm dung lượng ổ cứng VPS
            echo "🧹 [5/5] Dọn dẹp Docker images rác..."
            docker image prune -f

            echo "✅ [CI/CD] Triển khai thành công lên https://meowback.shop!"
